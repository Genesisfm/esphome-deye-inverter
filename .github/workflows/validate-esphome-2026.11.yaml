name: Validate ESPHome 2026.11.0
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact ESPHome version
        run: pip install esphome==2026.11.0
      - name: Validate all inverter variants (no compilation or upload)
        run: |
          cp tests/*.yaml .
          esphome config deye_hybrid_1p_lv.yaml
          esphome config deye_hybrid_3p_lv.yaml
          esphome config deye_hybrid_3p_hv.yaml
